# Data collector: fetches new filings (and reads the important ones with AI) straight into the shared
# database, from GitHub's machines instead of the cloud server, which BSE, NSE and screener.in block.
# If GitHub's machines are blocked too, run the same command from a laptop (README §5).
#
# Needs two repository secrets: DATABASE_URL (the Neon link) and GEMINI_API_KEY.
name: Collect filings
on:
  schedule:
    - cron: "10,40 3-11 * * 1-5"   # every 30 min, 08:40-17:10 IST, Mon-Fri
  workflow_dispatch: {}
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FINN_RUN_SCHEDULER: "0"
    steps:
      - name: Skip if the secrets aren't set yet
        if: env.DATABASE_URL == ''
        run: echo "Add the DATABASE_URL and GEMINI_API_KEY repository secrets to enable the collector." && exit 0
      - uses: actions/checkout@v4
        if: env.DATABASE_URL != ''
      - uses: actions/setup-python@v5
        if: env.DATABASE_URL != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        if: env.DATABASE_URL != ''
        run: pip install -q -r backend/requirements.txt
      - name: Which sources answer from here
        if: env.DATABASE_URL != ''
        working-directory: backend
        run: python -m scripts.refresh check
      - name: New filings
        if: env.DATABASE_URL != ''
        working-directory: backend
        run: python -m scripts.refresh announcements
      - name: Read the important ones
        if: env.DATABASE_URL != ''
        working-directory: backend
        run: python -m scripts.refresh enrich
